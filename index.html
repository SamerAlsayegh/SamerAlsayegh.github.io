<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samer Alsayegh</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen flex items-center justify-center p-6">
  <main class="w-full max-w-sm mx-auto py-10">

    <div class="flex flex-col items-center text-center mb-8">
      <div class="w-20 h-20 rounded-full bg-gradient-to-br from-indigo-500 to-fuchsia-500 flex items-center justify-center text-2xl font-bold mb-4">S</div>
      <h1 class="text-xl font-semibold tracking-tight">Samer Alsayegh</h1>
      <p class="text-neutral-400 text-sm mt-2 leading-relaxed">Entrepreneur and builder focused on SaaS, AI, and growth &mdash; turning ideas into scalable businesses using technology, automation, and relentless execution.</p>
    </div>

    <!-- Social row -->
    <div class="grid grid-cols-2 gap-3 mb-4">
      <a href="http://instagram.com/samer409" target="_blank" rel="noopener"
         class="group flex items-center justify-center gap-2 rounded-xl bg-neutral-900 hover:bg-neutral-800 active:scale-90 active:bg-neutral-700 transition-all duration-150 ease-out py-4 border border-neutral-800 active:border-fuchsia-500/50 shadow-sm active:shadow-none">
        <svg class="w-5 h-5 transition-transform duration-150 group-active:scale-110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
        <span class="text-sm font-medium">Instagram</span>
      </a>
      <a href="https://www.linkedin.com/in/sameralsayegh/" target="_blank" rel="noopener"
         class="group flex items-center justify-center gap-2 rounded-xl bg-neutral-900 hover:bg-neutral-800 active:scale-90 active:bg-neutral-700 transition-all duration-150 ease-out py-4 border border-neutral-800 active:border-sky-500/50 shadow-sm active:shadow-none">
        <svg class="w-5 h-5 transition-transform duration-150 group-active:scale-110" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85 0-2.14 1.44-2.14 2.94v5.66H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/>
        </svg>
        <span class="text-sm font-medium">LinkedIn</span>
      </a>
    </div>

    <!-- Product cards -->
    <a href="https://ezi.services" target="_blank" rel="noopener"
       class="group flex items-center gap-4 rounded-xl bg-neutral-900 hover:bg-neutral-800 active:scale-95 active:bg-neutral-700 transition-all duration-150 ease-out p-4 border border-neutral-800 active:border-emerald-500/50 mb-3 shadow-sm active:shadow-none">
      <img src="https://www.google.com/s2/favicons?domain=ezi.services&sz=64" alt="Ezi logo"
           class="w-11 h-11 shrink-0 rounded-lg bg-white p-2 object-contain transition-transform duration-150 group-active:scale-110">
      <div class="flex-1 min-w-0 text-left">
        <p class="font-semibold text-sm">Ezi</p>
        <p class="text-neutral-400 text-xs truncate">Home services, booked simply</p>
      </div>
      <svg class="w-4 h-4 text-neutral-500 shrink-0 transition-transform duration-150 group-active:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </a>

    <a href="https://draftbase.co" target="_blank" rel="noopener"
       class="group flex items-center gap-4 rounded-xl bg-neutral-900 hover:bg-neutral-800 active:scale-95 active:bg-neutral-700 transition-all duration-150 ease-out p-4 border border-neutral-800 active:border-indigo-500/50 shadow-sm active:shadow-none">
      <img src="https://www.google.com/s2/favicons?domain=draftbase.co&sz=64" alt="Draftbase logo"
           class="w-11 h-11 shrink-0 rounded-lg bg-white p-2 object-contain transition-transform duration-150 group-active:scale-110">
      <div class="flex-1 min-w-0 text-left">
        <p class="font-semibold text-sm">Draftbase</p>
        <p class="text-neutral-400 text-xs truncate">Headless CMS built for speed</p>
      </div>
      <svg class="w-4 h-4 text-neutral-500 shrink-0 transition-transform duration-150 group-active:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </a>

    <p class="text-center text-neutral-600 text-xs mt-10">Scan to connect</p>
  </main>
</body>
</html>
